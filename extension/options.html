<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archiver</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="options">
  <main>
    <img src="icons/128.png" width="48" height="48" alt="">
    <section id="connected" hidden>
      <h1 data-t="connectedTitle"></h1>
      <p id="connected-text"></p>
      <button id="disconnect" type="button" data-t="disconnect"></button>
    </section>
    <form id="form" hidden>
      <h1 data-t="connectTitle"></h1>
      <p data-t="connectText"></p>
      <label><span data-t="server"></span>
        <input id="server" type="text" inputmode="url" autocapitalize="none" spellcheck="false" placeholder="https://archiver.example.com" autocomplete="url" required>
      </label>
      <label><span data-t="username"></span>
        <input id="username" type="text" autocomplete="username" autocapitalize="none" required>
      </label>
      <label><span data-t="password"></span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>
      <p id="error" role="alert" hidden></p>
      <button id="submit" type="submit" class="primary" data-t="connect"></button>
    </form>
  </main>
  <script src="shared.js"></script>
  <script src="options.js"></script>
</body>
</html>
