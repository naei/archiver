# Isolated S3 integration tests against a disposable Moto emulator.
services:
  s3:
    image: motoserver/moto:5.2.4
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/')"]
      interval: 2s
      timeout: 2s
      retries: 20
  tests:
    build:
      context: ..
    environment:
      TEST_S3_ENDPOINT: http://s3:5000
    volumes:
      - .:/app/tests:ro
    command: ["python", "-m", "unittest", "discover", "-s", "tests", "-v"]
    depends_on:
      s3:
        condition: service_healthy
