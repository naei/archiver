<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <title>Archiver</title>
  <link rel="icon" href="__ARCHIVER_ICON__" type="image/svg+xml">
  <style>
__ARCHIVER_STYLE__
  </style>
  <script>__ARCHIVER_THEME__</script>
</head>
<body data-readonly="1">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to the library</a>
  <header class="mobile-bar">
    <button class="icon-button" id="open-menu" type="button" aria-controls="sidebar" aria-expanded="false" data-i18n-aria="nav.menu"><span data-icon="menu"></span></button>
    <span class="brand"><img src="__ARCHIVER_ICON__" width="32" height="32" alt="">archiver</span>
  </header>
  <div class="sidebar-backdrop" id="sidebar-backdrop" hidden></div>
  <aside class="sidebar" id="sidebar">
    <span class="brand"><img src="__ARCHIVER_ICON__" width="32" height="32" alt="">archiver</span>
    <p class="viewer-date" id="viewer-date"></p>
    <nav aria-label="Library" data-i18n-aria="nav.all">
      <button class="nav-button active" data-view="all"><span data-icon="library"></span><span data-i18n="nav.all">Library</span><span class="count" id="all-count">0</span></button>
      <div class="tags-heading status-heading" hidden><span data-i18n="statuses.heading">Status</span></div>
      <button class="nav-button" data-view="gone" data-status hidden><span data-icon="archive"></span><span data-i18n="nav.gone">Gone</span><span class="count" id="gone-count">0</span></button>
    </nav>
    <div class="tags-heading"><span data-i18n="tags.heading">Tags</span><span id="tags-icon" data-icon="tag"></span><button class="status-toggle" id="tags-clear" type="button" hidden></button></div>
    <div class="tag-search" id="tag-search-field" hidden><span data-icon="search"></span><label class="sr-only" for="tag-search" data-i18n="tags.search">Search tags</label><input type="search" id="tag-search" autocomplete="off" data-i18n-placeholder="tags.search"></div>
    <div id="tag-nav" class="tag-nav"></div>
    <div class="sidebar-bottom">
      <div class="preferences">
        <button class="sidebar-link settings-toggle" id="settings-toggle" type="button" aria-haspopup="menu" aria-expanded="false" aria-controls="settings-menu" data-i18n-aria="settings.open" data-i18n-title="settings.open"><span data-icon="settings"></span></button>
        <div class="context-menu settings-menu" id="settings-menu" role="menu" data-i18n-aria="settings.open" hidden>
          <div role="group" aria-labelledby="settings-language" data-languages><p class="menu-label" id="settings-language" data-i18n="pref.language">Language</p></div>
        </div>
        <button class="sidebar-link theme-toggle" id="theme-toggle" type="button"><span data-icon="sun"></span></button>
        <button class="sidebar-link private-toggle" id="private-toggle" type="button" aria-pressed="false"></button>
      </div>
      <div class="sidebar-status">
        <p class="sidebar-meta" data-i18n-title="storage.label"><span data-icon="drive"></span><span class="sr-only" data-i18n="storage.label">Storage used</span><span id="storage-size">—</span></p>
      </div>
    </div>
  </aside>
  <main id="main" tabindex="-1">
    <header class="page-header">
      <h1 id="page-title" data-i18n="nav.all">Library</h1>
      <button class="button secondary player-button" id="open-player" type="button"><span data-icon="play"></span><span data-i18n="player.open">Player</span></button>
    </header>

    <section class="collection">
      <div class="collection-toolbar">
        <div class="search-field"><span data-icon="search"></span><label class="sr-only" for="search" data-i18n="search.label">Search the library</label><input type="search" id="search" autocomplete="off" data-i18n-placeholder="search.placeholder"></div>
        <p class="result-count" id="result-count" role="status"></p>
        <div class="collection-controls">
          <button class="toolbar-button" id="toggle-filters" type="button" aria-expanded="false" aria-controls="filter-panel"><span data-icon="filter"></span><span data-i18n="filter.open">Filters</span><span class="filter-count" id="filter-count"></span></button>
          <button class="toolbar-button view-options-toggle" id="toggle-view-options" type="button" aria-expanded="false" aria-controls="view-options" data-i18n-aria="layout.options"><span data-icon="more"></span></button>
          <div class="view-options" id="view-options">
            <button class="toolbar-button" id="toggle-layout" type="button"></button>
            <label class="sr-only" for="sort" data-i18n="sort.label">Sort</label>
            <select id="sort"><option value="newest" data-i18n="sort.newest">Recently added</option><option value="oldest" data-i18n="sort.oldest">Oldest added</option><option value="published" data-i18n="sort.published">Recently published</option><option value="published-oldest" data-i18n="sort.publishedOldest">Oldest published</option><option value="title" data-i18n="sort.title">Title A–Z</option><option value="title-desc" data-i18n="sort.titleDesc">Title Z–A</option></select>
          </div>
        </div>
      </div>
      <div id="filter-panel" class="filter-panel" hidden>
        <label class="filter-field"><span data-i18n="filter.platform">Platform</span>
          <select id="filter-platform"><option value="" data-i18n="filter.allPlatforms">All platforms</option></select></label>
        <label class="filter-field"><span data-i18n="filter.date">Date</span>
          <select id="filter-date-field"><option value="created_at" data-i18n="date.added">Added</option><option value="published_at" data-i18n="date.published">Published</option></select></label>
        <label class="filter-field"><span data-i18n="filter.from">From</span><input type="date" id="filter-from"></label>
        <label class="filter-field"><span data-i18n="filter.to">To</span><input type="date" id="filter-to"></label>
        <label class="filter-check"><input type="checkbox" id="search-text"><span data-i18n="filter.searchText">Search inside articles and subtitles too</span></label>
        <button class="text-link filter-clear" id="filter-clear" type="button" data-i18n="filter.clear">Clear filters</button>
      </div>
      <div id="active-filter" class="active-filter" hidden></div>
      <div id="library" tabindex="-1" class="media-grid" aria-busy="true"></div>
      <div id="library-more" class="library-more" aria-hidden="true"></div>
      <div id="empty" class="empty-state" hidden>
        <h2 id="empty-title"></h2>
        <p id="empty-description"></p>
        <button class="button secondary" id="empty-action"></button>
      </div>
    </section>
  </main>

  <dialog id="detail-dialog" aria-labelledby="detail-title">
    <div class="detail-top"><button class="icon-button" id="close-detail" data-i18n-aria="action.close"><span data-icon="close"></span></button></div>
    <div id="detail-content" tabindex="-1"></div>
  </dialog>
  <dialog id="media-dialog" class="media-dialog">
    <button class="icon-button" id="close-media" data-i18n-aria="action.close"><span data-icon="close"></span></button>
    <div id="media-content"></div>
  </dialog>
  <div id="player" class="player" role="dialog" aria-modal="true" data-i18n-aria="player.open" hidden>
    <div class="player-top">
      <span class="player-position" id="player-position"></span>
      <div class="player-controls">
        <button class="player-toggle" id="player-info-toggle" type="button" aria-pressed="false" aria-controls="player-info" data-i18n-aria="player.info" data-i18n-title="player.infoKey"><span data-icon="info"></span></button>
        <button class="player-toggle" id="player-autoplay" type="button" aria-pressed="false" data-i18n-aria="player.autoplay" data-i18n-title="player.autoplay"><span data-icon="autoplay"></span></button>
        <button class="player-toggle" id="player-fill" type="button" aria-pressed="false" data-i18n-aria="player.fill" data-i18n-title="player.fill"><span data-icon="expand"></span></button>
        <button class="icon-button player-close" id="player-close" type="button" data-i18n-aria="action.close"><span data-icon="close"></span></button>
      </div>
    </div>
    <div class="player-track" id="player-track"></div>
    <button class="player-arrow up" id="player-up" type="button" data-i18n-aria="player.previous"><span data-icon="up"></span></button>
    <button class="player-arrow down" id="player-down" type="button" data-i18n-aria="player.next"><span data-icon="down"></span></button>
    <div class="player-caption" id="player-caption"></div>
    <aside class="player-info" id="player-info" data-i18n-aria="player.info" hidden></aside>
  </div>
  <div id="toast" class="toast" role="status" hidden></div>
  <script type="application/json" id="catalog">__ARCHIVER_CATALOG__</script>
  <script>
__ARCHIVER_SCRIPTS__
  </script>
</body>
</html>
