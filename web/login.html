<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#14161c" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#fafbfc" media="(prefers-color-scheme: light)">
  <meta name="robots" content="noindex">
  <title>Archiver</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-title" content="Archiver">
  <link rel="stylesheet" href="/style.css">
  <script src="/theme.js"></script>
  <script src="/i18n.js" defer></script>
  <script src="/login.js" defer></script>
</head>
<body>
  <main class="auth">
    <span class="brand"><img src="/favicon.svg" width="32" height="32" alt="">archiver</span>
    <form id="auth-form" class="auth-form" hidden>
      <h1 id="auth-title"></h1>
      <p id="auth-text" class="auth-text" data-i18n="auth.setupText" hidden></p>
      <label class="field"><span data-i18n="auth.username"></span>
        <input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" maxlength="64" required>
      </label>
      <label class="field"><span data-i18n="auth.password"></span>
        <input id="password" name="password" type="password" autocomplete="current-password" required>
        <span class="field-hint" id="password-hint" data-i18n="auth.passwordHint" hidden></span>
      </label>
      <label class="field" id="confirm-field" hidden><span data-i18n="auth.confirm"></span>
        <input id="confirm" type="password" autocomplete="new-password">
      </label>
      <p class="form-error" id="auth-error" role="alert" hidden></p>
      <button class="button primary" type="submit" id="auth-submit"></button>
    </form>
    <div class="preferences auth-preferences">
      <label class="sr-only" for="language" data-i18n="pref.language">Language</label>
      <select id="language" data-languages></select>
    </div>
  </main>
</body>
</html>
